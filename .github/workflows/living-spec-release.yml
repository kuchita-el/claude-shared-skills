# living-spec の検査器（tools/living-spec）を、起動した時点の main の先頭のコミット（github.sha）で
# ビルド・試験し、1ファイルの生成物を Release へ添付して公開する。
#
# 目的: 利用者が依存を導入せずに検査器を取れるよう、ビルド済みの生成物を、ビルド元の
# コミット SHA だけで同定して配る（タグと Release の名前は living-spec-<sha>）。
#
# 起動契機: 保守者が workflow_dispatch で起動したときだけ走る。入力は取らない。起動契機とその
# 理由の正本は docs/development/living-spec-release.md の (2)、main の先頭で切る理由の正本は (3) である。
#
# 権限の置き方: 最上位と build・smoke の job は contents: read に留め、書き込み
# （contents: write）は Release を作る release job だけに渡す。release job は
# チェックアウト・依存の導入・ビルド・試験を行わず、受け渡された生成物だけを扱う。
# SHA は run: に埋め込まず、env を経由して渡す。
#
# 起動の手順・失敗時の扱いの正本: docs/development/living-spec-release.md

name: living-spec release

run-name: living-spec release ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-spec-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SHA: ${{ github.sha }}
      ASSET: living-spec-${{ github.sha }}.mjs
    steps:
      # 起動した ref を照合する。理由と限界の正本は docs/development/living-spec-release.md の (5)。
      # この照合があるので、github.sha は起動した時点の main の先頭である。
      # ここで止まれば、needs により release job は走らない。
      - name: 起動した定義が main のものであることを確かめる
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::このワークフローは main の定義でだけ起動する（起動した ref: $GITHUB_REF）。--ref を付けずに起動する" >&2
            exit 1
          fi

      - name: 起動したコミットを取り出す
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # 同じ SHA の Release があれば、ビルドの前に止める。gh release view の失敗は、
      # Release が無いとき（release not found）だけ先へ進め、認証・通信の失敗では止める。
      - name: 同じ SHA の Release が無いことを確かめる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh release view "living-spec-$SHA" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "::error::Release living-spec-$SHA は既にある。同じ SHA では切り直さない" >&2
            exit 1
          fi
          if [[ "$out" != *"release not found"* ]]; then
            echo "::error::Release の有無を確かめられなかった: $out" >&2
            exit 1
          fi

      - name: mise を入れる
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
        with:
          install: false

      - name: リポジトリの設定を信頼する
        run: mise trust

      - name: node と pnpm をそろえる
        run: mise install

      - name: 依存を入れる
        run: pnpm --dir tools/living-spec install --frozen-lockfile

      - name: ビルドする
        run: pnpm --dir tools/living-spec build

      # 依存の導入先から辿れない場所へ写す。同梱の漏れがあれば、次の試験が読み込みの時点で落ちる。
      - name: 生成物を SHA の名前で置く
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp tools/living-spec/dist/living-spec.mjs "$RUNNER_TEMP/release/$ASSET"

      - name: 入口と描画の試験を生成物に掛ける
        env:
          RDRA_ENTRY: ${{ runner.temp }}/release/${{ env.ASSET }}
        run: node --test tools/living-spec/test/cli.test.ts tools/living-spec/test/render.test.ts tools/living-spec/test/difflist.test.ts

      - name: 生成物を受け渡す
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: living-spec-asset
          path: ${{ runner.temp }}/release/${{ env.ASSET }}
          if-no-files-found: error

  # plugins/living-spec/README.md の前提（Node 22 以上）の下限と、mise.toml が固定する系列で起動を確かめる。
  # チェックアウトせず、依存の無い場所で生成物だけを起動する。
  smoke:
    name: smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '24']
    env:
      ASSET: living-spec-${{ github.sha }}.mjs
    steps:
      - name: Node を入れる
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Node の版を確かめる
        env:
          EXPECTED: v${{ matrix.node }}
        run: |
          actual=$(node --version)
          if [[ "$actual" != "$EXPECTED" && "$actual" != "$EXPECTED".* ]]; then
            echo "::error::node の版が $actual で、期待する $EXPECTED と違う" >&2
            exit 1
          fi

      - name: 生成物を受け取る
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: living-spec-asset
          path: ${{ runner.temp }}/smoke

      # 終了コードは step の中で受け取って比べる。step の失敗を無視する書き方はしない。
      - name: 引数なしで起動して使い方を出すことを確かめる
        working-directory: ${{ runner.temp }}/smoke
        run: |
          code=0
          err=$(node "./$ASSET" 2>&1 >/dev/null) || code=$?
          if [[ "$code" -ne 2 ]]; then
            echo "::error::引数なしの起動の終了コードが $code で、期待する 2 と違う" >&2
            echo "$err" >&2
            exit 1
          fi
          if [[ "$err" != *"使い方: living-spec"* ]]; then
            echo "::error::引数なしの起動が、標準エラーに使い方を出さなかった" >&2
            echo "$err" >&2
            exit 1
          fi

  # 書き込み権限を持つ唯一の job。チェックアウト・依存の導入・ビルド・試験を行わない。
  # 使うアクションは actions/download-artifact だけで、ほかに外部のコードを取って実行しない。
  # 使う命令は gh・curl・cmp とシェルの組み込みに限る。
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build
      - smoke
    env:
      SHA: ${{ github.sha }}
      TAG: living-spec-${{ github.sha }}
      ASSET: living-spec-${{ github.sha }}.mjs
    steps:
      - name: 生成物を受け取る
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: living-spec-asset
          path: ${{ runner.temp }}/release

      # gh release create は同名のタグがあれば、指す先を問わずそれを使う。そのため、
      # 同名のタグが無いか、同じコミットを指す軽量タグであるときだけ先へ進む。
      # matching-refs は前方一致なので、ref の完全一致で絞る。注釈付きタグ（object.type が tag）は通さない。
      - name: 同名のタグが無いか、同じコミットを指すことを確かめる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          listing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[] | "\(.ref) \(.object.type) \(.object.sha)"')
          while read -r ref type sha; do
            if [[ "$ref" != "refs/tags/$TAG" ]]; then
              continue
            fi
            if [[ "$type" != "commit" || "$sha" != "$SHA" ]]; then
              echo "::error::タグ $TAG は既にあり、$SHA を直接指していない（種別 $type、指す先 $sha）。Release を作らずに止める" >&2
              exit 1
            fi
            echo "タグ $TAG は既にあり、$SHA を指している。このタグで Release を作る"
          done <<< "$listing"

      - name: Release を作って添付し公開する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(printf '%s\n' \
            "living-spec の検査器の生成物。版はビルド元のコミット SHA で同定し、プラグインの版ではない。" \
            "" \
            "- ビルド元のコミット: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA" \
            "- 実行記録: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh release create "$TAG" "$RUNNER_TEMP/release/$ASSET" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --notes "$notes"

      - name: 公開した添付物を認証なしで取り、受け渡しと一致することを確かめる
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/published.mjs" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          if ! cmp "$RUNNER_TEMP/published.mjs" "$RUNNER_TEMP/release/$ASSET"; then
            echo "::error::公開した添付物が受け渡しと一致しない" >&2
            exit 1
          fi
