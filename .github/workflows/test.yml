name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785  # v5.2.8
        with:
          install: false

      - name: Trust repository configuration
        run: mise trust

      - name: Install test tools
        run: mise install

      # 版を固定する。validator の判定が版で変われば、変更と無関係な PR が赤になるため。
      # 更新は意図した PR で行う。
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.263

      # RUN_TESTS_REQUIRE_ALL_SUITES=1 は、claude を解決できない場合に
      # claude-plugin-validate が SKIPPED で緑を返すことを禁じる。CI が CLI を導入し
      # 損ねても「一度も走らないまま緑」にならないようにするための担保である。
      - name: Run test suite
        run: bash scripts/run-tests.sh
        env:
          RUN_TESTS_REQUIRE_ALL_SUITES: "1"

  # adr プラグインの lint-adr.sh は bash 4.2 以上を要し、足りない版では原因を示して exit 2 で止まる。
  # macOS の既定の /bin/bash は 3.2 であり、その実体で版の判定が働くことを確かめる。
  # bats は BASH_VERSION を差し替えて分岐を確かめるが、本物の 3.2 が判定より前の行を解釈できる
  # ことまでは確かめないため、bash 3.2 の公式コンテナで実測する。版は macOS の /bin/bash に揃える。
  lint-adr-old-bash:
    name: lint-adr on bash 3.2
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run lint-adr.sh under bash 3.2
        run: bash scripts/check-lint-adr-old-bash.sh docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w bash:3.2.57@sha256:2556c2da19c32c1614d318645c73a7bf64d38be21cf69e98e3ca51f053983719 bash
